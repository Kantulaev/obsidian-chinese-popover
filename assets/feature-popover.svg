<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glass Popover Body -->
    <linearGradient id="pop-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 30, 46, 0.94)" />
      <stop offset="100%" stop-color="rgba(14, 18, 30, 0.98)" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="pop-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pop-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="560" fill="url(#pop-bg)" />

  <!-- Ambient Lighting Glows -->
  <circle cx="180" cy="140" r="160" fill="#38bdf8" opacity="0.09" filter="blur(65px)" />
  <circle cx="850" cy="200" r="220" fill="#818cf8" opacity="0.08" filter="blur(80px)" />
  <circle cx="500" cy="460" r="150" fill="#10b981" opacity="0.06" filter="blur(60px)" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 36)">
    <rect width="280" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">APPLE MINIMALIST &amp; CONTEXT EXAMPLES</text>
    <text x="0" y="54" class="font-sans" font-size="24" font-weight="800" fill="#f8fafc">Apple Liquid Glass &amp; Side-by-Side Examples</text>
    <text x="0" y="74" class="font-sans" font-size="13" fill="#94a3b8">Refined typography (13px pinyin, 16px translation), parts of speech, discreet mini HSK, and horizontal examples drawer.</text>
  </g>

  <!-- ================= FLOATING POPOVER CONTAINER (880 x 380) ================= -->
  <g transform="translate(60, 130)" filter="url(#pop-shadow)">
    <!-- Base Card Frame -->
    <rect width="880" height="380" rx="18" fill="url(#pop-glass)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
    <rect x="1" y="1" width="878" height="50" rx="17" fill="url(#pop-specular)" pointer-events="none" />

    <!-- Drag grabber -->
    <rect x="200" y="7" width="34" height="3.5" rx="2" fill="rgba(255, 255, 255, 0.22)" />

    <!-- LEFT COLUMN: MAIN CARD (430px) -->
    <g transform="translate(20, 16)">
      <!-- Top Bar: Hanzi Pill + 🔊 Speaker + ⭐ Star -->
      <g>
        <!-- Capsule Pill -->
        <g>
          <rect width="250" height="34" rx="17" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" />
          <text x="16" y="23" class="font-kaiti" font-size="21" font-weight="700" fill="#ffffff">学习</text>
          <text x="68" y="22" class="font-sans" font-size="16" fill="rgba(255, 255, 255, 0.45)">-</text>
          <text x="82" y="23" class="font-kaiti" font-size="21" font-weight="600" fill="#cbd5e1">學習</text>
          <rect x="194" y="7" width="46" height="20" rx="5" fill="#3b82f6" fill-opacity="0.25" />
          <text x="203" y="21" class="font-sans" font-size="10" font-weight="700" fill="#60a5fa">SIMP</text>
        </g>

        <!-- Actions: 🔊 Audio & ⭐ Star -->
        <g transform="translate(320, 3)">
          <!-- Audio Button -->
          <circle cx="14" cy="14" r="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
          <text x="8" y="19" class="font-sans" font-size="12">🔊</text>

          <!-- Star Button (Favorited) -->
          <g transform="translate(38, 0)">
            <circle cx="14" cy="14" r="14" fill="rgba(255, 214, 10, 0.18)" stroke="rgba(255, 214, 10, 0.4)" stroke-width="1" />
            <text x="8" y="19" class="font-sans" font-size="13" fill="#ffd60a">⭐</text>
          </g>
        </g>
      </g>

      <!-- Refined Pinyin Hero (13px) -->
      <g transform="translate(2, 54)">
        <text x="0" y="14" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8" letter-spacing="0.2">xué xí</text>
        <text x="46" y="14" class="font-sans" font-size="13" fill="rgba(255, 255, 255, 0.35)">/</text>
        <text x="56" y="14" class="font-mono" font-size="13" font-weight="500" fill="#34d399">hok6 zaap6</text>
      </g>

      <!-- Structured Definitions Grouped by Part of Speech (Large 16px Translation) -->
      <g transform="translate(2, 88)">
        <!-- Definition Group 1: Verb with Mini HSK Number -->
        <g>
          <!-- Discreet Mini HSK Badge -->
          <circle cx="9" cy="9" r="8.5" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
          <text x="6" y="13" class="font-sans" font-size="9.5" font-weight="700" fill="#facc15">1</text>

          <!-- POS Tag [verb] -->
          <g transform="translate(24, 0)">
            <rect width="38" height="18" rx="5" fill="rgba(16, 185, 129, 0.18)" stroke="rgba(16, 185, 129, 0.38)" stroke-width="1" />
            <text x="7" y="13" class="font-sans" font-size="10" font-weight="700" fill="#34d399">verb</text>
          </g>

          <!-- Numbered Definitions (16px) -->
          <g transform="translate(70, 14)">
            <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>to study
              <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>to learn
            </text>
            <text x="0" y="24" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">3. </tspan>to emulate
            </text>
          </g>
        </g>

        <!-- Definition Group 2: Noun -->
        <g transform="translate(0, 54)">
          <!-- POS Tag [noun] -->
          <g transform="translate(24, 0)">
            <rect width="38" height="18" rx="5" fill="rgba(56, 189, 248, 0.18)" stroke="rgba(56, 189, 248, 0.38)" stroke-width="1" />
            <text x="6" y="13" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">noun</text>
          </g>
          <g transform="translate(70, 14)">
            <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>study
              <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>learning
            </text>
          </g>
        </g>
      </g>

      <!-- Character Decomposition Chips -->
      <g transform="translate(2, 202)">
        <text x="0" y="14" class="font-sans" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">RADICAL ANATOMY:</text>
        <g transform="translate(136, 0)">
          <g>
            <rect width="130" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="17" class="font-kaiti" font-size="13.5" font-weight="700" fill="#ffffff">学</text>
            <text x="24" y="16" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xué</text>
            <text x="52" y="16" class="font-sans" font-size="10.5" fill="#cbd5e1">to study</text>
          </g>
          <g transform="translate(138, 0)">
            <rect width="130" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="17" class="font-kaiti" font-size="13.5" font-weight="700" fill="#ffffff">习</text>
            <text x="24" y="16" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xí</text>
            <text x="44" y="16" class="font-sans" font-size="10.5" fill="#cbd5e1">to practice</text>
          </g>
        </g>
      </g>

      <!-- Bottom Action Row: Spacer + Active ⋯ Details Button -->
      <g transform="translate(2, 310)">
        <g transform="translate(370, 0)">
          <rect width="28" height="22" rx="6" fill="rgba(56, 189, 248, 0.28)" stroke="rgba(56, 189, 248, 0.65)" stroke-width="1" />
          <text x="8" y="16" class="font-sans" font-size="14" font-weight="700" fill="#38bdf8">⋯</text>
        </g>
      </g>
    </g>

    <!-- VERTICAL DIVIDER -->
    <line x1="440" y1="18" x2="440" y2="362" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <!-- RIGHT COLUMN: EXPANDED CONTEXT EXAMPLES PANEL (420px) -->
    <g transform="translate(458, 16)">
      <!-- Side Panel Header -->
      <g>
        <text x="0" y="14" class="font-sans" font-size="11.5" font-weight="700" fill="rgba(255, 255, 255, 0.7)" letter-spacing="0.5">例句 CONTEXT EXAMPLES (2)</text>
        <line x1="0" y1="24" x2="400" y2="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      </g>

      <!-- Example Sentence 1 Box -->
      <g transform="translate(0, 36)">
        <rect width="404" height="132" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        
        <!-- Chinese + Audio -->
        <g transform="translate(14, 18)">
          <text x="0" y="16" class="font-kaiti" font-size="17" font-weight="700" fill="#ffffff">我每天都在学习中文。</text>
          <text x="354" y="16" class="font-sans" font-size="13">🔊</text>
        </g>

        <!-- Book-style Pinyin with Accent Tone Marks (no digits!) -->
        <text x="14" y="66" class="font-sans" font-size="13" font-weight="550" fill="#38bdf8" letter-spacing="0.2">Wǒ měitiān dōu zài xuéxí zhōngwén.</text>

        <!-- English Translation -->
        <text x="14" y="96" class="font-sans" font-size="14" font-weight="500" fill="#f1f5f9">I study Chinese every day.</text>
        <!-- Grammar Note -->
        <text x="14" y="118" class="font-sans" font-size="11.5" fill="#94a3b8">HSK 1 grammar: 在 (zài) + verb indicates ongoing action</text>
      </g>

      <!-- Example Sentence 2 Box -->
      <g transform="translate(0, 184)">
        <rect width="404" height="132" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        
        <!-- Chinese + Audio -->
        <g transform="translate(14, 18)">
          <text x="0" y="16" class="font-kaiti" font-size="17" font-weight="700" fill="#ffffff">我们要向他学习。</text>
          <text x="354" y="16" class="font-sans" font-size="13">🔊</text>
        </g>

        <!-- Book-style Pinyin with Accent Tone Marks (no digits!) -->
        <text x="14" y="66" class="font-sans" font-size="13" font-weight="550" fill="#38bdf8" letter-spacing="0.2">Wǒmen yào xiàng tā xuéxí.</text>

        <!-- English Translation -->
        <text x="14" y="96" class="font-sans" font-size="14" font-weight="500" fill="#f1f5f9">We should all learn from him.</text>
        <!-- Grammar Note -->
        <text x="14" y="118" class="font-sans" font-size="11.5" fill="#94a3b8">Preposition pattern: 向 (xiàng) + person + 学习 (emulate)</text>
      </g>
    </g>
  </g>
</svg>