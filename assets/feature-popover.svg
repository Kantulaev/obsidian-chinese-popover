<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glass Popover Body -->
    <linearGradient id="pop-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 30, 46, 0.94)" />
      <stop offset="100%" stop-color="rgba(14, 18, 30, 0.98)" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="pop-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Feature Card Glass -->
    <linearGradient id="feature-card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(22, 30, 48, 0.85)" />
      <stop offset="100%" stop-color="rgba(13, 19, 32, 0.92)" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pop-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.22" />
    </filter>

    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="560" fill="url(#pop-bg)" />

  <!-- Ambient Lighting Glows -->
  <circle cx="200" cy="140" r="170" fill="#38bdf8" opacity="0.1" filter="blur(70px)" />
  <circle cx="820" cy="220" r="210" fill="#818cf8" opacity="0.09" filter="blur(80px)" />
  <circle cx="500" cy="460" r="160" fill="#10b981" opacity="0.07" filter="blur(65px)" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 36)">
    <rect width="240" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">APPLE LIQUID GLASS POPOVER</text>
    <text x="0" y="54" class="font-sans" font-size="24" font-weight="800" fill="#f8fafc">Minimalist Apple Liquid Glass Popover</text>
    <text x="0" y="74" class="font-sans" font-size="13" fill="#94a3b8">Balanced typography (13px pinyin, 16px translation), dual Mandarin/Cantonese audio, and 214 Kangxi radicals anatomy.</text>
  </g>

  <!-- ================= LEFT FEATURE CALLOUT CARDS ================= -->
  <g transform="translate(60, 136)">
    <!-- Card 1: Apple Liquid Glass -->
    <g filter="url(#card-shadow)">
      <rect width="220" height="136" rx="14" fill="url(#feature-card-glass)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
      <g transform="translate(16, 18)">
        <circle cx="14" cy="14" r="14" fill="rgba(56, 189, 248, 0.18)" />
        <text x="8" y="19" class="font-sans" font-size="13">💎</text>
        <text x="36" y="19" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Liquid Glass</text>
        <text x="0" y="46" class="font-sans" font-size="11.5" line-height="1.4" fill="#94a3b8">Refined 18px squircle frosted card with fluid saturation, blur, and draggable grabber bar.</text>
      </g>
    </g>

    <!-- Card 2: Dual Cantonese & Mandarin Audio -->
    <g transform="translate(0, 154)" filter="url(#card-shadow)">
      <rect width="220" height="136" rx="14" fill="url(#feature-card-glass)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2" />
      <g transform="translate(16, 18)">
        <circle cx="14" cy="14" r="14" fill="rgba(16, 185, 129, 0.18)" />
        <text x="8" y="19" class="font-sans" font-size="13">🔊</text>
        <text x="36" y="19" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Dual Audio</text>
        <text x="0" y="46" class="font-sans" font-size="11.5" fill="#94a3b8">Natural Mandarin (zh-CN) &amp; Cantonese (zh-yue) pronunciation with instant speed controls.</text>
      </g>
    </g>
  </g>

  <!-- ================= CENTER: COMPACT APPLE LIQUID GLASS POPOVER (380 x 290) ================= -->
  <g transform="translate(310, 136)" filter="url(#pop-shadow)">
    <!-- Base Card Frame -->
    <rect width="380" height="290" rx="18" fill="url(#pop-glass)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
    <rect x="1" y="1" width="378" height="48" rx="17" fill="url(#pop-specular)" pointer-events="none" />

    <!-- Drag grabber centered -->
    <rect x="173" y="7" width="34" height="3.5" rx="2" fill="rgba(255, 255, 255, 0.24)" />

    <!-- Popover Content -->
    <g transform="translate(20, 18)">
      <!-- Top Bar: Hanzi Capsule Pill + 🔊 Audio + ⭐ Star -->
      <g>
        <!-- Capsule Pill -->
        <g>
          <rect width="240" height="34" rx="17" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" />
          <text x="14" y="23" class="font-kaiti" font-size="21" font-weight="700" fill="#ffffff">学习</text>
          <text x="64" y="22" class="font-sans" font-size="16" fill="rgba(255, 255, 255, 0.45)">-</text>
          <text x="76" y="23" class="font-kaiti" font-size="21" font-weight="600" fill="#cbd5e1">學習</text>
          <rect x="184" y="7" width="46" height="20" rx="5" fill="#3b82f6" fill-opacity="0.25" />
          <text x="193" y="21" class="font-sans" font-size="10" font-weight="700" fill="#60a5fa">SIMP</text>
        </g>

        <!-- Actions: 🔊 Audio & ⭐ Star -->
        <g transform="translate(262, 3)">
          <!-- Audio Button -->
          <circle cx="14" cy="14" r="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
          <text x="8" y="19" class="font-sans" font-size="12">🔊</text>

          <!-- Star Button (Favorited) -->
          <g transform="translate(36, 0)">
            <circle cx="14" cy="14" r="14" fill="rgba(255, 214, 10, 0.18)" stroke="rgba(255, 214, 10, 0.4)" stroke-width="1" />
            <text x="8" y="19" class="font-sans" font-size="13" fill="#ffd60a">⭐</text>
          </g>
        </g>
      </g>

      <!-- Refined Pinyin Hero (13.5px) -->
      <g transform="translate(2, 54)">
        <text x="0" y="14" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8" letter-spacing="0.2">xué xí</text>
        <text x="46" y="14" class="font-sans" font-size="13" fill="rgba(255, 255, 255, 0.35)">/</text>
        <text x="56" y="14" class="font-mono" font-size="13" font-weight="500" fill="#34d399">hok6 zaap6</text>
      </g>

      <!-- Structured Definitions Grouped by Part of Speech (Large 16px Translation) -->
      <g transform="translate(2, 88)">
        <!-- Definition Group 1: Verb with Mini HSK Number -->
        <g>
          <!-- Discreet Mini HSK Badge -->
          <circle cx="9" cy="9" r="8.5" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
          <text x="6" y="13" class="font-sans" font-size="9.5" font-weight="700" fill="#facc15">1</text>

          <!-- POS Tag [verb] -->
          <g transform="translate(24, 0)">
            <rect width="38" height="18" rx="5" fill="rgba(16, 185, 129, 0.18)" stroke="rgba(16, 185, 129, 0.38)" stroke-width="1" />
            <text x="7" y="13" class="font-sans" font-size="10" font-weight="700" fill="#34d399">verb</text>
          </g>

          <!-- Numbered Definitions (16px) -->
          <g transform="translate(70, 14)">
            <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>to study
              <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>to learn
            </text>
            <text x="0" y="24" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">3. </tspan>to emulate
            </text>
          </g>
        </g>

        <!-- Definition Group 2: Noun -->
        <g transform="translate(0, 54)">
          <!-- POS Tag [noun] -->
          <g transform="translate(24, 0)">
            <rect width="38" height="18" rx="5" fill="rgba(56, 189, 248, 0.18)" stroke="rgba(56, 189, 248, 0.38)" stroke-width="1" />
            <text x="6" y="13" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">noun</text>
          </g>
          <g transform="translate(70, 14)">
            <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>study
              <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
              <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>learning
            </text>
          </g>
        </g>
      </g>

      <!-- Character Decomposition Chips -->
      <g transform="translate(2, 204)">
        <text x="0" y="15" class="font-sans" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">RADICAL ANATOMY:</text>
        <g transform="translate(126, 0)">
          <g>
            <rect width="102" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="17" class="font-kaiti" font-size="13.5" font-weight="700" fill="#ffffff">学</text>
            <text x="24" y="16" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xué</text>
            <text x="50" y="16" class="font-sans" font-size="10" fill="#cbd5e1">study</text>
          </g>
          <g transform="translate(108, 0)">
            <rect width="102" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="17" class="font-kaiti" font-size="13.5" font-weight="700" fill="#ffffff">习</text>
            <text x="24" y="16" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xí</text>
            <text x="42" y="16" class="font-sans" font-size="10" fill="#cbd5e1">practice</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT FEATURE CALLOUT CARDS ================= -->
  <g transform="translate(720, 136)">
    <!-- Card 3: Grammar Parts of Speech & HSK -->
    <g filter="url(#card-shadow)">
      <rect width="220" height="136" rx="14" fill="url(#feature-card-glass)" stroke="rgba(250, 204, 21, 0.25)" stroke-width="1.2" />
      <g transform="translate(16, 18)">
        <circle cx="14" cy="14" r="14" fill="rgba(250, 204, 21, 0.18)" />
        <text x="8" y="19" class="font-sans" font-size="13">📚</text>
        <text x="36" y="19" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Grammar &amp; HSK</text>
        <text x="0" y="46" class="font-sans" font-size="11.5" fill="#94a3b8">Clean categorization into verb, noun, adj, etc., paired with discreet HSK 1–6 indicators.</text>
      </g>
    </g>

    <!-- Card 4: Kangxi Radicals & Anatomy -->
    <g transform="translate(0, 154)" filter="url(#card-shadow)">
      <rect width="220" height="136" rx="14" fill="url(#feature-card-glass)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.2" />
      <g transform="translate(16, 18)">
        <circle cx="14" cy="14" r="14" fill="rgba(168, 85, 247, 0.18)" />
        <text x="8" y="19" class="font-sans" font-size="13">🧩</text>
        <text x="36" y="19" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">Radical Anatomy</text>
        <text x="0" y="46" class="font-sans" font-size="11.5" fill="#94a3b8">Click any character chip to inspect its Kangxi radical, component decomposition, and stroke count.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM FEATURE BANNER PILL ================= -->
  <g transform="translate(60, 480)" filter="url(#card-shadow)">
    <rect width="880" height="42" rx="12" fill="rgba(18, 25, 42, 0.95)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <g transform="translate(20, 26)" class="font-sans" font-size="12" font-weight="600" fill="#94a3b8">
      <text x="0" y="0">⭐ <tspan fill="#f8fafc">1-Click Star to Markdown Vault Notebook</tspan></text>
      <text x="270" y="0">🗃️ <tspan fill="#f8fafc">AnkiConnect Sync &amp; Pleco Export</tspan></text>
      <text x="540" y="0">🔄 <tspan fill="#f8fafc">20-Language Reverse Lookup</tspan></text>
      <text x="755" y="0">📖 <tspan fill="#f8fafc">Reader Mode</tspan></text>
    </g>
  </g>
</svg>
