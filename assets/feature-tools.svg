<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tools-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glass Cards -->
    <linearGradient id="tools-card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(26, 35, 54, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 23, 40, 0.95)" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="tools-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="tools-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="560" fill="url(#tools-bg)" />

  <!-- Ambient Glows -->
  <circle cx="220" cy="180" r="180" fill="#f43f5e" opacity="0.08" filter="blur(70px)" />
  <circle cx="500" cy="240" r="200" fill="#38bdf8" opacity="0.07" filter="blur(75px)" />
  <circle cx="820" cy="200" r="190" fill="#10b981" opacity="0.08" filter="blur(70px)" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 42)">
    <rect width="176" height="26" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />
    <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#f43f5e" letter-spacing="1">ADVANCED STUDY TOOLS</text>
    <text x="0" y="54" class="font-sans" font-size="24" font-weight="800" fill="#f8fafc">Stroke Order, HSK Text Analyzer &amp; Word Notes</text>
    <text x="0" y="74" class="font-sans" font-size="13" fill="#94a3b8">Animated Mizige calligraphy grids, whole-vault vocabulary statistics, Chengyu fables, and printable worksheets.</text>
  </g>

  <!-- ================= GRID OF 3 SUITE PANELS ================= -->

  <!-- PANEL 1: STROKE ORDER CALLIGRAPHY (米字格 Mizige) -->
  <g transform="translate(60, 136)" filter="url(#tools-shadow)">
    <rect width="280" height="380" rx="16" fill="url(#tools-card-glass)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
    <rect x="1" y="1" width="278" height="44" rx="15" fill="url(#tools-specular)" pointer-events="none" />

    <!-- Header -->
    <g transform="translate(18, 16)">
      <text x="0" y="16" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">🖌️ Stroke Order (Mizige)</text>
      <text x="0" y="32" class="font-sans" font-size="11" fill="#94a3b8">Vector calligraphy steps &amp; playback</text>
    </g>

    <!-- Mizige Calligraphy Box (180 x 180) -->
    <g transform="translate(50, 68)">
      <!-- Mizige Grid Container -->
      <rect width="180" height="180" rx="10" fill="#fffaf0" stroke="#d97706" stroke-width="2" />
      
      <!-- Mizige Diagonal & Cross Lines -->
      <line x1="0" y1="0" x2="180" y2="180" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="180" y1="0" x2="0" y2="180" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="90" y1="0" x2="90" y2="180" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="0" y1="90" x2="180" y2="90" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,4" />

      <!-- Chinese Character "永" (The Eight Principles of Yong) with Red Active Stroke -->
      <text x="90" y="132" class="font-kaiti" font-size="124" font-weight="700" fill="#1e1e24" text-anchor="middle">永</text>
      <!-- Red animated stroke highlight -->
      <path d="M 90 28 Q 96 38 88 52" stroke="#ef4444" stroke-width="10" fill="none" stroke-linecap="round" />
    </g>

    <!-- Stroke Information -->
    <g transform="translate(18, 268)">
      <g>
        <rect width="244" height="32" rx="7" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.08)" />
        <text x="12" y="20" class="font-sans" font-size="11.5" fill="#f1f5f9">Stroke <tspan fill="#38bdf8" font-weight="700">1 / 5</tspan>: <tspan fill="#fca5a5" font-weight="700">点 (diǎn)</tspan> — Dot</text>
      </g>
    </g>

    <!-- Playback Controls -->
    <g transform="translate(42, 318)">
      <rect width="196" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.14)" />
      <text x="24" y="22" class="font-sans" font-size="14" fill="#cbd5e1">⏮️</text>
      <text x="68" y="22" class="font-sans" font-size="14" fill="#38bdf8">▶️</text>
      <text x="112" y="22" class="font-sans" font-size="14" fill="#cbd5e1">⏭️</text>
      <text x="150" y="21" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">1.0x</text>
    </g>
  </g>

  <!-- PANEL 2: HSK & TEXT DIFFICULTY ANALYZER -->
  <g transform="translate(360, 136)" filter="url(#tools-shadow)">
    <rect width="280" height="380" rx="16" fill="url(#tools-card-glass)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
    <rect x="1" y="1" width="278" height="44" rx="15" fill="url(#tools-specular)" pointer-events="none" />

    <!-- Header -->
    <g transform="translate(18, 16)">
      <text x="0" y="16" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">📊 Text Difficulty &amp; HSK</text>
      <text x="0" y="32" class="font-sans" font-size="11" fill="#94a3b8">Vault difficulty &amp; HSK 1–6 metrics</text>
    </g>

    <!-- Overall Rating Badge -->
    <g transform="translate(18, 68)">
      <rect width="244" height="42" rx="10" fill="rgba(16, 185, 129, 0.16)" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="26" class="font-sans" font-size="13" font-weight="700" fill="#34d399">Overall Level: HSK 2 / CEFR A2</text>
    </g>

    <!-- Progress Bars for Levels -->
    <g transform="translate(18, 130)">
      <!-- HSK 1: 45% -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">HSK 1</text>
        <text x="210" y="12" class="font-sans" font-size="11" fill="#38bdf8">45%</text>
        <rect y="18" width="244" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="18" width="110" height="8" rx="4" fill="#38bdf8" />
      </g>

      <!-- HSK 2: 30% -->
      <g transform="translate(0, 38)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">HSK 2</text>
        <text x="210" y="12" class="font-sans" font-size="11" fill="#10b981">30%</text>
        <rect y="18" width="244" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="18" width="73" height="8" rx="4" fill="#10b981" />
      </g>

      <!-- HSK 3: 15% -->
      <g transform="translate(0, 76)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">HSK 3</text>
        <text x="210" y="12" class="font-sans" font-size="11" fill="#fbbf24">15%</text>
        <rect y="18" width="244" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="18" width="36" height="8" rx="4" fill="#fbbf24" />
      </g>

      <!-- HSK 4-6 / Beyond HSK: 10% -->
      <g transform="translate(0, 114)">
        <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">HSK 4–6 / Beyond HSK</text>
        <text x="210" y="12" class="font-sans" font-size="11" fill="#a855f7">10%</text>
        <rect y="18" width="244" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="18" width="24" height="8" rx="4" fill="#a855f7" />
      </g>
    </g>

    <!-- Stats Summary Footer -->
    <g transform="translate(18, 296)">
      <rect width="244" height="56" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.08)" />
      <text x="12" y="24" class="font-sans" font-size="11.5" fill="#94a3b8">Total words in text: <tspan fill="#ffffff" font-weight="700">428</tspan></text>
      <text x="12" y="42" class="font-sans" font-size="11.5" fill="#94a3b8">Unique characters: <tspan fill="#ffffff" font-weight="700">184</tspan></text>
    </g>
  </g>

  <!-- PANEL 3: ATOMIC WORD NOTES, CHENGYU & WORKSHEETS -->
  <g transform="translate(660, 136)" filter="url(#tools-shadow)">
    <rect width="280" height="380" rx="16" fill="url(#tools-card-glass)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />
    <rect x="1" y="1" width="278" height="44" rx="15" fill="url(#tools-specular)" pointer-events="none" />

    <!-- Header -->
    <g transform="translate(18, 16)">
      <text x="0" y="16" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">📝 Notes &amp; Worksheets</text>
      <text x="0" y="32" class="font-sans" font-size="11" fill="#94a3b8">Zettelkasten, fables, PDF sheets</text>
    </g>

    <!-- Item 1: Atomic Word Note -->
    <g transform="translate(18, 68)">
      <rect width="244" height="82" rx="10" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <text x="12" y="24" class="font-sans" font-size="13" font-weight="700" fill="#c084fc">📝 Atomic Word Notes</text>
      <text x="12" y="44" class="font-sans" font-size="11" fill="#94a3b8">1-click creation in <tspan fill="#e2e8f0">Chinese/Words/</tspan></text>
      <text x="12" y="62" class="font-sans" font-size="11" fill="#94a3b8">YAML, tags, pinyin, context &amp; links.</text>
    </g>

    <!-- Item 2: Chengyu Origin Story -->
    <g transform="translate(18, 160)">
      <rect width="244" height="96" rx="10" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
      <text x="12" y="24" class="font-sans" font-size="13" font-weight="700" fill="#fbbf24">📜 Chengyu Stories (成语故事)</text>
      <text x="12" y="44" class="font-kaiti" font-size="13" font-weight="700" fill="#ffffff">«画蛇添足» — Draw a snake and add feet</text>
      <text x="12" y="64" class="font-sans" font-size="10.5" fill="#94a3b8">Warring States Period (Zhan Guo Ce):</text>
      <text x="12" y="80" class="font-sans" font-size="10.5" fill="#cbd5e1">Ruining an achievement with excess.</text>
    </g>

    <!-- Item 3: Printable PDF Worksheets -->
    <g transform="translate(18, 268)">
      <rect width="244" height="84" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="12" y="24" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8">🖨️ Printable Worksheets</text>
      <text x="12" y="44" class="font-sans" font-size="11" fill="#94a3b8">Mizige grid calligraphy practice sheets</text>
      <text x="12" y="62" class="font-sans" font-size="11" fill="#cbd5e1">Export to PDF or print for pen practice.</text>
    </g>
  </g>
</svg>
