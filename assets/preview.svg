<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="main-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Obsidian Window Background -->
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121724" />
      <stop offset="100%" stop-color="#0c101a" />
    </linearGradient>

    <!-- Liquid Glass Popover Body -->
    <linearGradient id="glass-popover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 30, 46, 0.94)" />
      <stop offset="100%" stop-color="rgba(14, 18, 30, 0.98)" />
    </linearGradient>

    <!-- Specular Highlight Reflections -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="ambient-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="popover-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.22" />
    </filter>

    <filter id="pill-glow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1200" height="700" fill="url(#main-bg)" />

  <!-- Ambient Soft Lighting Orbs -->
  <circle cx="200" cy="160" r="220" fill="#38bdf8" opacity="0.1" filter="blur(80px)" />
  <circle cx="1000" cy="220" r="240" fill="#818cf8" opacity="0.1" filter="blur(85px)" />
  <circle cx="600" cy="560" r="200" fill="#10b981" opacity="0.08" filter="blur(75px)" />

  <!-- ================= OBSIDIAN APP CONTAINER ================= -->
  <g transform="translate(60, 45)" filter="url(#ambient-shadow)">
    <!-- App Window Outer Frame -->
    <rect width="1080" height="610" rx="18" fill="url(#window-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />

    <!-- TITLEBAR -->
    <g>
      <path d="M 0 18 A 18 18 0 0 1 18 0 L 1062 0 A 18 18 0 0 1 1080 18 L 1080 46 L 0 46 Z" fill="#0e131f" />
      <line x1="0" y1="46" x2="1080" y2="46" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

      <!-- Traffic Lights -->
      <circle cx="24" cy="23" r="6" fill="#ff5f57" />
      <circle cx="44" cy="23" r="6" fill="#febc2e" />
      <circle cx="64" cy="23" r="6" fill="#28c840" />

      <!-- Tabs -->
      <g transform="translate(100, 10)">
        <rect width="190" height="28" rx="7" fill="#182032" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <circle cx="16" cy="14" r="3.5" fill="#38bdf8" />
        <text x="26" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9">Daily-Chinese.md</text>
        <text x="172" y="18" class="font-sans" font-size="11" fill="#64748b">✕</text>
      </g>
      <g transform="translate(298, 10)">
        <rect width="180" height="28" rx="7" fill="transparent" />
        <text x="14" y="19" class="font-sans" font-size="12" fill="#64748b">Chinese Vocabulary.md</text>
      </g>

      <!-- Vault Name (Center) -->
      <text x="540" y="27" class="font-sans" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Personal Knowledge Vault — Obsidian v1.8</text>
    </g>

    <!-- LEFT RIBBON BAR -->
    <g transform="translate(0, 46)">
      <rect width="44" height="536" fill="#0b0f19" />
      <line x1="44" y1="0" x2="44" y2="536" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      
      <g transform="translate(12, 16)" fill="#64748b">
        <text y="14" class="font-sans" font-size="15">📁</text>
        <text y="50" class="font-sans" font-size="15">🔍</text>
        <rect x="-4" y="74" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.16)" />
        <text y="94" class="font-sans" font-size="15" fill="#38bdf8">🏮</text>
        <text y="138" class="font-sans" font-size="15">⭐</text>
        <text y="174" class="font-sans" font-size="15">⚙️</text>
      </g>
    </g>

    <!-- MAIN EDITOR CANVAS -->
    <g transform="translate(68, 66)">
      <g transform="translate(20, 16)">
        <text x="0" y="24" class="font-sans" font-size="22" font-weight="800" fill="#ffffff"># 🏮 Everyday Chinese Practice · 常用中文</text>
        <text x="0" y="58" class="font-sans" font-size="14" fill="#94a3b8">Interactive study session for Mandarin Putonghua &amp; Cantonese Jyutping:</text>

        <!-- Bullet 1 -->
        <g transform="translate(0, 88)">
          <text x="0" y="14" class="font-sans" font-size="14" fill="#64748b">•</text>
          <text x="14" y="14" class="font-sans" font-size="14" fill="#cbd5e1">早晨！今朝天气真系好。(Morning! The weather this morning is great.)</text>
        </g>

        <!-- Bullet 2 (Target Selection Sentence: 学习) -->
        <g transform="translate(0, 126)">
          <text x="0" y="14" class="font-sans" font-size="14" fill="#64748b">•</text>
          <text x="14" y="14" class="font-sans" font-size="15" fill="#cbd5e1">我们一起去</text>

          <!-- Word Selection Box for 学习 -->
          <g transform="translate(94, -6)">
            <rect width="48" height="28" rx="6" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="1.5" />
            <text x="5" y="20" class="font-kaiti" font-size="18" font-weight="700" fill="#38bdf8">学习</text>
          </g>

          <text x="148" y="14" class="font-sans" font-size="15" fill="#cbd5e1">中文吧！</text>
          <text x="216" y="14" class="font-sans" font-size="13" fill="#64748b">— Let's go learn Chinese together!</text>
        </g>

        <!-- Bullet 3 -->
        <g transform="translate(0, 164)">
          <text x="0" y="14" class="font-sans" font-size="14" fill="#64748b">•</text>
          <text x="14" y="14" class="font-sans" font-size="14" fill="#cbd5e1">唔該晒你嘅幫忙。(Thank you very much for your kind help.)</text>
        </g>
      </g>
    </g>

    <!-- BOTTOM STATUS BAR -->
    <g transform="translate(0, 582)">
      <rect width="1080" height="28" fill="#0a0d16" />
      <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      <g transform="translate(20, 18)" class="font-sans" font-size="11" fill="#64748b">
        <text x="0" y="0">UTF-8</text>
        <text x="70" y="0">428 words</text>
        <text x="150" y="0">HSK 1–2</text>
        <g transform="translate(890, -12)">
          <rect width="150" height="20" rx="5" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
          <text x="8" y="14" font-size="10.5" font-weight="600" fill="#38bdf8">🏮 Chinese Dict: Active</text>
        </g>
      </g>
    </g>

    <!-- ================= FLOATING APPLE LIQUID GLASS POPOVER (COMPACT CARD) ================= -->
    <g transform="translate(180, 224)" filter="url(#popover-shadow)">
      <!-- Popover Main Card Base (Width 370 x 276) -->
      <rect width="370" height="276" rx="18" fill="url(#glass-popover)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
      <rect x="1" y="1" width="368" height="46" rx="17" fill="url(#glass-specular)" pointer-events="none" />

      <!-- Drag grabber centered on card -->
      <rect x="168" y="7" width="34" height="3.5" rx="2" fill="rgba(255, 255, 255, 0.22)" />

      <!-- MAIN CARD CONTENT -->
      <g transform="translate(18, 16)">
        <!-- Top Bar: Hanzi Pill (Simplified - Traditional) + 🔊 Audio + ⭐ Star Button -->
        <g>
          <!-- Capsule Pill -->
          <g>
            <rect width="240" height="34" rx="17" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" />
            <text x="14" y="23" class="font-kaiti" font-size="21" font-weight="700" fill="#ffffff">学习</text>
            <text x="64" y="22" class="font-sans" font-size="16" fill="rgba(255, 255, 255, 0.45)">-</text>
            <text x="76" y="23" class="font-kaiti" font-size="21" font-weight="600" fill="#cbd5e1">學習</text>
            <rect x="184" y="7" width="46" height="20" rx="5" fill="#3b82f6" fill-opacity="0.25" />
            <text x="193" y="21" class="font-sans" font-size="10" font-weight="700" fill="#60a5fa">SIMP</text>
          </g>

          <!-- Actions: 🔊 Audio & ⭐ Star -->
          <g transform="translate(254, 3)">
            <!-- Audio Button -->
            <circle cx="14" cy="14" r="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
            <text x="8" y="19" class="font-sans" font-size="12">🔊</text>

            <!-- Star Button (Favorited) -->
            <g transform="translate(36, 0)">
              <circle cx="14" cy="14" r="14" fill="rgba(255, 214, 10, 0.18)" stroke="rgba(255, 214, 10, 0.4)" stroke-width="1" />
              <text x="8" y="19" class="font-sans" font-size="13" fill="#ffd60a">⭐</text>
            </g>
          </g>
        </g>

        <!-- Refined Compact Pinyin (13.5px) -->
        <g transform="translate(2, 54)">
          <text x="0" y="14" class="font-sans" font-size="13.5" font-weight="600" fill="#38bdf8" letter-spacing="0.2">xué xí</text>
          <text x="46" y="14" class="font-sans" font-size="13" fill="rgba(255, 255, 255, 0.35)">/</text>
          <text x="56" y="14" class="font-mono" font-size="13" font-weight="500" fill="#34d399">hok6 zaap6</text>
        </g>

        <!-- Structured Definitions Grouped by Part of Speech (Large 16px Translation) -->
        <g transform="translate(2, 88)">
          <!-- Definition Group 1: Verb with Mini HSK Number -->
          <g>
            <!-- Discreet Mini HSK Badge -->
            <circle cx="9" cy="9" r="8.5" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
            <text x="6" y="13" class="font-sans" font-size="9.5" font-weight="700" fill="#facc15">1</text>

            <!-- POS Tag [verb] -->
            <g transform="translate(24, 0)">
              <rect width="38" height="18" rx="5" fill="rgba(16, 185, 129, 0.18)" stroke="rgba(16, 185, 129, 0.38)" stroke-width="1" />
              <text x="7" y="13" class="font-sans" font-size="10" font-weight="700" fill="#34d399">verb</text>
            </g>

            <!-- Numbered Definitions (16px) -->
            <g transform="translate(70, 14)">
              <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
                <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>to study
                <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
                <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>to learn
              </text>
              <text x="0" y="24" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
                <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">3. </tspan>to emulate
              </text>
            </g>
          </g>

          <!-- Definition Group 2: Noun -->
          <g transform="translate(0, 52)">
            <!-- POS Tag [noun] -->
            <g transform="translate(24, 0)">
              <rect width="38" height="18" rx="5" fill="rgba(56, 189, 248, 0.18)" stroke="rgba(56, 189, 248, 0.38)" stroke-width="1" />
              <text x="6" y="13" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">noun</text>
            </g>
            <g transform="translate(70, 14)">
              <text x="0" y="0" class="font-sans" font-size="16" font-weight="500" fill="#ffffff">
                <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">1. </tspan>study
                <tspan fill="rgba(255,255,255,0.3)"> • </tspan>
                <tspan font-size="11" font-weight="700" fill="rgba(255,255,255,0.45)">2. </tspan>learning
              </text>
            </g>
          </g>
        </g>

        <!-- Character Decomposition Chips -->
        <g transform="translate(2, 194)">
          <g>
            <rect width="150" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="18" class="font-kaiti" font-size="14" font-weight="700" fill="#ffffff">学</text>
            <text x="24" y="17" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xué</text>
            <text x="52" y="17" class="font-sans" font-size="11" fill="#cbd5e1">to study</text>
          </g>
          <g transform="translate(158, 0)">
            <rect width="150" height="26" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
            <text x="8" y="18" class="font-kaiti" font-size="14" font-weight="700" fill="#ffffff">习</text>
            <text x="24" y="17" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xí</text>
            <text x="44" y="17" class="font-sans" font-size="11" fill="#cbd5e1">to practice</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING FEATURE CALLOUT PILLS ================= -->
  <!-- Pill 1: Top Right - Apple Liquid Glass & Pin -->
  <g transform="translate(860, 24)" filter="url(#pill-glow)">
    <rect width="270" height="42" rx="12" fill="rgba(18, 25, 42, 0.95)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="22" cy="21" r="10" fill="rgba(56, 189, 248, 0.2)" />
    <text x="16" y="26" class="font-sans" font-size="12">💎</text>
    <text x="38" y="26" class="font-sans" font-size="12.5" font-weight="700" fill="#f8fafc">Apple Liquid Glass (18px)</text>
  </g>

  <!-- Pill 2: Bottom Right - 20-Language Dictionaries & Audio -->
  <g transform="translate(760, 620)" filter="url(#pill-glow)">
    <rect width="370" height="42" rx="12" fill="rgba(18, 25, 42, 0.95)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="22" cy="21" r="10" fill="rgba(56, 189, 248, 0.2)" />
    <text x="15" y="26" class="font-sans" font-size="12">🌏</text>
    <text x="38" y="26" class="font-sans" font-size="12.5" font-weight="700" fill="#f8fafc">20-Language Dictionaries &amp; Audio</text>
  </g>

  <!-- Pill 3: Bottom Left - Parts of Speech & Mini HSK -->
  <g transform="translate(60, 620)" filter="url(#pill-glow)">
    <rect width="330" height="42" rx="12" fill="rgba(18, 25, 42, 0.95)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="22" cy="21" r="10" fill="rgba(16, 185, 129, 0.2)" />
    <text x="16" y="26" class="font-sans" font-size="12">📚</text>
    <text x="38" y="26" class="font-sans" font-size="12.5" font-weight="700" fill="#f8fafc">Parts of Speech &amp; Discreet Mini HSK</text>
  </g>
</svg>