<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glass Popover Body -->
    <linearGradient id="pop-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(26, 34, 52, 0.92)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.96)" />
    </linearGradient>

    <!-- Drawer Glass -->
    <linearGradient id="pop-drawer-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 15, 28, 0.85)" />
      <stop offset="100%" stop-color="rgba(5, 8, 16, 0.92)" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="pop-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Accents -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pop-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>

    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glow-badge" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="560" fill="url(#pop-bg)" />

  <!-- Ambient Lighting Glows -->
  <circle cx="180" cy="140" r="160" fill="#38bdf8" opacity="0.09" filter="blur(65px)" />
  <circle cx="850" cy="200" r="220" fill="#818cf8" opacity="0.08" filter="blur(80px)" />
  <circle cx="500" cy="460" r="150" fill="#10b981" opacity="0.06" filter="blur(60px)" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 42)">
    <rect width="168" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">POPOVER &amp; ANATOMY</text>
    <text x="0" y="54" class="font-sans" font-size="24" font-weight="800" fill="#f8fafc">Apple Liquid Glass &amp; Character Anatomy</text>
    <text x="0" y="74" class="font-sans" font-size="13" fill="#94a3b8">Interactive desktop-grade dictionary card with Kangxi radical decomposition and 34px compact action palette.</text>
  </g>

  <!-- ================= LEFT: MAIN INTERACTIVE POPOVER CARD ================= -->
  <g transform="translate(60, 136)" filter="url(#pop-shadow)">
    <!-- Popover Base Card -->
    <rect width="520" height="380" rx="18" fill="url(#pop-glass)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
    <rect x="1" y="1" width="518" height="60" rx="17" fill="url(#pop-specular)" pointer-events="none" />

    <!-- TOP BAR -->
    <g transform="translate(18, 16)">
      <!-- Hanzi Pill (Simplified + Traditional) -->
      <g>
        <rect width="190" height="36" rx="9" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="24" class="font-kaiti" font-size="19" font-weight="700" fill="#ffffff">学习</text>
        <text x="62" y="23" class="font-sans" font-size="13" fill="#64748b">|</text>
        <text x="76" y="24" class="font-kaiti" font-size="19" font-weight="600" fill="#94a3b8">學習</text>
        <rect x="135" y="8" width="44" height="20" rx="5" fill="#3b82f6" fill-opacity="0.25" />
        <text x="143" y="22" class="font-sans" font-size="10" font-weight="700" fill="#60a5fa">SIMP</text>
      </g>

      <!-- Audio Button -->
      <g transform="translate(202, 0)">
        <rect width="112" height="36" rx="9" fill="rgba(16, 185, 129, 0.14)" stroke="#10b981" stroke-width="1.2" />
        <text x="12" y="23" class="font-sans" font-size="14" fill="#34d399">🔊</text>
        <text x="32" y="22" class="font-sans" font-size="11" font-weight="700" fill="#34d399">普通话</text>
        <text x="76" y="22" class="font-sans" font-size="11" fill="#6ee7b7">1.0x</text>
      </g>

      <!-- Compact 34px Action Palette (Burger dock) -->
      <g transform="translate(324, 0)">
        <rect width="168" height="36" rx="9" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="12" y="23" class="font-sans" font-size="13" fill="#94a3b8">📋</text>
        <text x="40" y="23" class="font-sans" font-size="13" fill="#fbbf24">⭐</text>
        <text x="68" y="23" class="font-sans" font-size="13" fill="#38bdf8">📌</text>
        <text x="96" y="23" class="font-sans" font-size="13" fill="#a78bfa">📝</text>
        <text x="122" y="23" class="font-sans" font-size="13" fill="#ec4899">🖌️</text>
        <text x="148" y="23" class="font-sans" font-size="13" fill="#64748b">✕</text>
      </g>
    </g>

    <!-- PHONETICS & BADGES -->
    <g transform="translate(20, 72)">
      <!-- Tone Colored Pinyin -->
      <text x="0" y="22" class="font-sans" font-size="23" font-weight="700" fill="url(#cyan-blue)" letter-spacing="0.5">xué xí</text>
      
      <!-- Cantonese Jyutping Badge -->
      <g transform="translate(112, 2)">
        <rect width="118" height="26" rx="7" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
        <text x="8" y="18" class="font-mono" font-size="12" font-weight="700" fill="#34d399">粵</text>
        <text x="24" y="18" class="font-mono" font-size="13" font-weight="700" fill="#6ee7b7">hok6 zaap6</text>
      </g>

      <!-- HSK 1 Badge -->
      <g transform="translate(242, 2)">
        <rect width="64" height="26" rx="7" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8">HSK 1</text>
      </g>

      <!-- Multi-POS Badge -->
      <g transform="translate(316, 2)">
        <rect width="90" height="26" rx="7" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11" font-weight="600" fill="#c084fc">глаг · сущ</text>
      </g>
    </g>

    <!-- DEFINITIONS (RUSSIAN & ENGLISH) -->
    <g transform="translate(20, 116)">
      <!-- Russian translation (BKRS) -->
      <g>
        <circle cx="6" cy="7" r="3" fill="#38bdf8" />
        <text x="18" y="12" class="font-sans" font-size="13.5" font-weight="600" fill="#ffffff">учиться; изучать; обучение, учёба</text>
      </g>
      <!-- English translation (CC-CEDICT) -->
      <g transform="translate(0, 22)">
        <circle cx="6" cy="7" r="3" fill="#64748b" />
        <text x="18" y="12" class="font-sans" font-size="12.5" fill="#cbd5e1">to learn; to study; study, studies</text>
      </g>
    </g>

    <!-- DIVIDER -->
    <line x1="20" y1="168" x2="500" y2="168" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <!-- CHARACTER BREAKDOWN ROW -->
    <g transform="translate(20, 180)">
      <text x="0" y="17" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">РАЗБИВКА СЛОВА:</text>

      <!-- Chip 1: 学 (ACTIVE / EXPANDED) -->
      <g transform="translate(108, 0)" filter="url(#glow-badge)">
        <rect width="180" height="28" rx="7" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="10" y="19" class="font-kaiti" font-size="14" font-weight="700" fill="#ffffff">学</text>
        <text x="28" y="18" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xué</text>
        <text x="56" y="18" class="font-sans" font-size="11" fill="#e2e8f0">учиться</text>
        <rect x="136" y="5" width="34" height="18" rx="4" fill="rgba(56, 189, 248, 0.25)" />
        <text x="142" y="17" class="font-kaiti" font-size="10" fill="#38bdf8">#39 子</text>
      </g>

      <!-- Chip 2: 习 -->
      <g transform="translate(300, 0)">
        <rect width="180" height="28" rx="7" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1" />
        <text x="10" y="19" class="font-kaiti" font-size="14" font-weight="700" fill="#ffffff">习</text>
        <text x="28" y="18" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">xí</text>
        <text x="48" y="18" class="font-sans" font-size="11" fill="#94a3b8">упражняться</text>
        <rect x="132" y="5" width="38" height="18" rx="4" fill="rgba(255, 255, 255, 0.1)" />
        <text x="138" y="17" class="font-kaiti" font-size="10" fill="#94a3b8">#124 羽</text>
      </g>
    </g>

    <!-- EXPANDED CHARACTER ANATOMY DRAWER (Under 学) -->
    <g transform="translate(20, 222)">
      <rect width="480" height="142" rx="12" fill="url(#pop-drawer-glass)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />

      <!-- Drawer Header -->
      <g transform="translate(14, 14)">
        <text x="0" y="16" class="font-kaiti" font-size="20" font-weight="700" fill="#ffffff">学</text>
        <text x="24" y="16" class="font-sans" font-size="13" font-weight="600" fill="#38bdf8">[xué]</text>
        <text x="68" y="16" class="font-sans" font-size="12.5" fill="#f1f5f9">учиться, изучать, наука</text>

        <!-- Audio inside Drawer -->
        <g transform="translate(390, -4)">
          <rect width="64" height="24" rx="6" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
          <text x="8" y="16" class="font-sans" font-size="11" fill="#38bdf8">🔊</text>
          <text x="24" y="16" class="font-sans" font-size="10.5" font-weight="600" fill="#ffffff">Звук</text>
        </g>
      </g>

      <line x1="14" y1="44" x2="466" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <!-- Drawer Content: Radical & Composition -->
      <g transform="translate(14, 62)">
        <!-- Line 1: Kangxi Radical -->
        <g>
          <rect width="52" height="18" rx="4" fill="rgba(56, 189, 248, 0.18)" />
          <text x="6" y="13" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">КЛЮЧ</text>
          <text x="60" y="13" class="font-sans" font-size="12" fill="#cbd5e1">#39 <tspan fill="#ffffff" font-weight="700" font-family="'KaiTi', serif">«子»</tspan> [zǐ] — ребенок, сын, дитя (3 черты)</text>
        </g>

        <!-- Line 2: Character Composition / Etymology -->
        <g transform="translate(0, 26)">
          <rect width="60" height="18" rx="4" fill="rgba(192, 132, 252, 0.18)" />
          <text x="6" y="13" class="font-sans" font-size="10" font-weight="700" fill="#c084fc">СОСТАВ</text>
          <text x="68" y="13" class="font-sans" font-size="12" fill="#cbd5e1"><tspan fill="#ffffff" font-weight="700" font-family="'KaiTi', serif">冖</tspan> (покров/школа) + <tspan fill="#ffffff" font-weight="700" font-family="'KaiTi', serif">子</tspan> (дитя) — познание под кровом учителя</text>
        </g>

        <!-- Line 3: Stroke count & info -->
        <g transform="translate(0, 52)">
          <text x="0" y="12" class="font-sans" font-size="11" fill="#64748b">💡 Нажмите на любой иероглиф слова, чтобы мгновенно изучить его ключ и строение.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: FEATURE CALLOUT CARDS ================= -->
  <g transform="translate(620, 136)">
    <!-- Feature 1: Liquid Glass & Pin -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="320" height="82" rx="14" fill="#131b2e" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
      <circle cx="34" cy="41" r="18" fill="rgba(56, 189, 248, 0.15)" />
      <text x="24" y="47" class="font-sans" font-size="16">💎</text>
      <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Apple Liquid Glass UI</text>
      <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">Плавный блюр, Drag &amp; Drop, Pin (📌) на экране и моментальный ресайз.</text>
    </g>

    <!-- Feature 2: Character Anatomy & Radicals -->
    <g transform="translate(0, 98)" filter="url(#card-shadow)">
      <rect width="320" height="82" rx="14" fill="#131b2e" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.2" />
      <circle cx="34" cy="41" r="18" fill="rgba(192, 132, 252, 0.15)" />
      <text x="24" y="47" class="font-sans" font-size="16">🔬</text>
      <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">214 Ключей Канси и Состав</text>
      <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">Шторка этимологии, пиктографический разбор и ключи по клику на знак.</text>
    </g>

    <!-- Feature 3: Compact Action Palette -->
    <g transform="translate(0, 196)" filter="url(#card-shadow)">
      <rect width="320" height="82" rx="14" fill="#131b2e" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2" />
      <circle cx="34" cy="41" r="18" fill="rgba(16, 185, 129, 0.15)" />
      <text x="24" y="47" class="font-sans" font-size="16">⚡</text>
      <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">34px Компакт-Бургер Меню</text>
      <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">Копирование, ⭐ словарик, 📝 заметки, анимация черт без вылезания за край.</text>
    </g>

    <!-- Feature 4: Russian BKRS & CEDICT -->
    <g transform="translate(0, 294)" filter="url(#card-shadow)">
      <rect width="320" height="82" rx="14" fill="#131b2e" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.2" />
      <circle cx="34" cy="41" r="18" fill="rgba(251, 191, 36, 0.15)" />
      <text x="24" y="47" class="font-sans" font-size="16">🇷🇺</text>
      <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">БКРС + CC-CEDICT (118k)</text>
      <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">Русские и английские переводы, части речи и HSK 1–6 уровни.</text>
    </g>
  </g>
</svg>
