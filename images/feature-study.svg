<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="study-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Sidebar Glass Gradient -->
    <linearGradient id="sidebar-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 32, 50, 0.92)" />
      <stop offset="100%" stop-color="rgba(15, 22, 38, 0.96)" />
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="vocab-card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 65, 0.75)" />
      <stop offset="100%" stop-color="rgba(18, 26, 44, 0.88)" />
    </linearGradient>

    <!-- Search Modal Glass -->
    <linearGradient id="modal-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(20, 28, 46, 0.96)" />
      <stop offset="100%" stop-color="rgba(12, 17, 30, 0.98)" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="study-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="cyan-blue2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="study-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.12" />
    </filter>

    <filter id="box-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-kaiti { font-family: "KaiTi", "楷体", "STKaiti", "PingFang SC", serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1000" height="560" fill="url(#study-bg)" />

  <!-- Ambient Lighting Glows -->
  <circle cx="200" cy="180" r="180" fill="#f59e0b" opacity="0.08" filter="blur(70px)" />
  <circle cx="800" cy="200" r="200" fill="#38bdf8" opacity="0.08" filter="blur(75px)" />
  <circle cx="500" cy="460" r="160" fill="#10b981" opacity="0.06" filter="blur(65px)" />

  <!-- SECTION HEADER -->
  <g transform="translate(60, 42)">
    <rect width="186" height="26" rx="6" fill="rgba(251, 191, 36, 0.12)" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1" />
    <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="1">STUDY &amp; SRS ECOSYSTEM</text>
    <text x="0" y="54" class="font-sans" font-size="24" font-weight="800" fill="#f8fafc">Vocabulary Book, Spaced Repetition &amp; Anki</text>
    <text x="0" y="74" class="font-sans" font-size="13" fill="#94a3b8">Permanent vault Markdown storage, SM-2 flashcard intervals, instant Spotlight dictionary and mobile export.</text>
  </g>

  <!-- ================= LEFT: SIDEBAR VOCABULARY NOTEBOOK ================= -->
  <g transform="translate(60, 136)" filter="url(#study-shadow)">
    <!-- Sidebar Frame -->
    <rect width="480" height="380" rx="18" fill="url(#sidebar-glass)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" />
    <rect x="1" y="1" width="478" height="50" rx="17" fill="url(#study-specular)" pointer-events="none" />

    <!-- Sidebar Header -->
    <g transform="translate(18, 16)">
      <text x="0" y="18" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">🏮 Личный словарик</text>
      <text x="175" y="18" class="font-sans" font-size="12" fill="#94a3b8">(Chinese Vocabulary.md)</text>
      
      <!-- Stats pills -->
      <g transform="translate(330, 0)">
        <rect width="112" height="26" rx="7" fill="rgba(251, 191, 36, 0.18)" stroke="#fbbf24" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11" font-weight="700" fill="#fbbf24">⭐ 142 слова</text>
      </g>
    </g>

    <!-- Search & Filter Bar -->
    <g transform="translate(18, 56)">
      <!-- Search Input Box -->
      <rect width="250" height="32" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="12" y="21" class="font-sans" font-size="12" fill="#64748b">🔍 Поиск в словарике...</text>

      <!-- SRS Due Filter Button (ACTIVE) -->
      <g transform="translate(260, 0)">
        <rect width="182" height="32" rx="8" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.2" />
        <text x="12" y="20" class="font-sans" font-size="11.5" font-weight="700" fill="#34d399">🔁 К повторению (18)</text>
      </g>
    </g>

    <!-- VOCABULARY CARD 1: 朋友 (INTERACTIVE SRS FLASHCARD) -->
    <g transform="translate(18, 102)">
      <rect width="444" height="152" rx="14" fill="url(#vocab-card-glass)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" />

      <!-- Card Top: Word, HSK, Audio -->
      <g transform="translate(16, 16)">
        <text x="0" y="20" class="font-kaiti" font-size="22" font-weight="700" fill="#ffffff">朋友</text>
        <text x="56" y="19" class="font-sans" font-size="16" font-weight="700" fill="#38bdf8">péngyou</text>

        <!-- Jyutping Badge -->
        <g transform="translate(142, 2)">
          <rect width="90" height="22" rx="6" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1" />
          <text x="6" y="15" class="font-mono" font-size="11" font-weight="700" fill="#34d399">pang4 jau5</text>
        </g>

        <!-- HSK Badge -->
        <g transform="translate(242, 2)">
          <rect width="52" height="22" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1" />
          <text x="7" y="15" class="font-sans" font-size="10.5" font-weight="700" fill="#38bdf8">HSK 1</text>
        </g>

        <!-- Audio Speaker Button -->
        <g transform="translate(365, -2)">
          <circle cx="14" cy="14" r="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" />
          <text x="7" y="19" class="font-sans" font-size="13">🔊</text>
        </g>
      </g>

      <!-- Translation & Context Sentence -->
      <g transform="translate(16, 52)">
        <text x="0" y="14" class="font-sans" font-size="12.5" font-weight="600" fill="#f1f5f9">друг, приятель; дружеский</text>
        <g transform="translate(0, 22)">
          <rect width="412" height="24" rx="6" fill="rgba(0, 0, 0, 0.28)" />
          <text x="8" y="16" class="font-sans" font-size="11" fill="#94a3b8">Контекст: <tspan fill="#e2e8f0" font-family="'KaiTi', serif">他是我的好朋友。</tspan> (Он мой хороший друг.)</text>
        </g>
      </g>

      <!-- SRS INTERVAL RATINGS (SM-2 Buttons) -->
      <g transform="translate(16, 110)">
        <text x="0" y="17" class="font-sans" font-size="10" font-weight="700" fill="#94a3b8">ОЦЕНКА SRS:</text>

        <!-- Again -->
        <g transform="translate(85, 0)">
          <rect width="74" height="26" rx="6" fill="rgba(239, 68, 68, 0.18)" stroke="#ef4444" stroke-width="1" />
          <text x="8" y="17" class="font-sans" font-size="10.5" font-weight="600" fill="#fca5a5">Снова 1д</text>
        </g>

        <!-- Hard -->
        <g transform="translate(167, 0)">
          <rect width="78" height="26" rx="6" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1" />
          <text x="8" y="17" class="font-sans" font-size="10.5" font-weight="600" fill="#fcd34d">Трудно 3д</text>
        </g>

        <!-- Good -->
        <g transform="translate(253, 0)">
          <rect width="86" height="26" rx="6" fill="rgba(16, 185, 129, 0.22)" stroke="#10b981" stroke-width="1.2" />
          <text x="8" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#34d399">Хорошо 7д</text>
        </g>

        <!-- Easy -->
        <g transform="translate(347, 0)">
          <rect width="80" height="26" rx="6" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1" />
          <text x="8" y="17" class="font-sans" font-size="10.5" font-weight="600" fill="#7dd3fc">Легко 14д</text>
        </g>
      </g>
    </g>

    <!-- VOCABULARY CARD 2 (Sneak peek): 电脑 -->
    <g transform="translate(18, 268)">
      <rect width="444" height="96" rx="14" fill="url(#vocab-card-glass)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <g transform="translate(16, 16)">
        <text x="0" y="20" class="font-kaiti" font-size="20" font-weight="700" fill="#ffffff">电脑</text>
        <text x="56" y="19" class="font-sans" font-size="15" font-weight="700" fill="#38bdf8">diànnǎo</text>
        <g transform="translate(138, 2)">
          <rect width="80" height="20" rx="5" fill="rgba(16, 185, 129, 0.15)" />
          <text x="6" y="14" class="font-mono" font-size="10.5" font-weight="700" fill="#34d399">din6 nou5</text>
        </g>
        <text x="0" y="44" class="font-sans" font-size="12" fill="#cbd5e1">компьютер, ЭВМ · [HSK 1] · 214 ключей: 电 (молния) + 脑 (мозг)</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: SPOTLIGHT MODAL & INTEGRATIONS ================= -->
  <g transform="translate(565, 136)">
    <!-- Spotlight Search Modal (Alt + S) -->
    <g filter="url(#box-shadow)">
      <rect width="375" height="185" rx="16" fill="url(#modal-glass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />

      <!-- Search Input Line -->
      <g transform="translate(16, 16)">
        <text x="0" y="20" class="font-sans" font-size="16" fill="#38bdf8">🔍</text>
        <text x="28" y="20" class="font-mono" font-size="15" font-weight="700" fill="#ffffff">nihao|</text>
        <rect x="250" y="0" width="76" height="24" rx="6" fill="rgba(255, 255, 255, 0.08)" />
        <text x="258" y="16" class="font-mono" font-size="11" fill="#94a3b8">Alt + S</text>
      </g>

      <line x1="16" y1="48" x2="359" y2="48" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <!-- Result 1 -->
      <g transform="translate(16, 62)">
        <rect width="343" height="52" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.25)" />
        <text x="12" y="22" class="font-kaiti" font-size="18" font-weight="700" fill="#ffffff">你好</text>
        <text x="60" y="21" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8">nǐ hǎo</text>
        <text x="120" y="21" class="font-mono" font-size="12" fill="#34d399">nei5 hou2</text>
        <text x="12" y="42" class="font-sans" font-size="11" fill="#cbd5e1">здравствуй(те); привет · hello, hi</text>
        <text x="305" y="32" class="font-sans" font-size="11" fill="#38bdf8">↵ Open</text>
      </g>

      <!-- Result 2 -->
      <g transform="translate(16, 122)">
        <text x="12" y="20" class="font-kaiti" font-size="16" font-weight="700" fill="#94a3b8">您好</text>
        <text x="60" y="19" class="font-sans" font-size="12" fill="#64748b">nínhǎo · Здравствуйте (вежл.)</text>
      </g>
    </g>

    <!-- Ecosystem Integration Cards -->
    <g transform="translate(0, 202)">
      <!-- Integration 1: Anki Sync -->
      <g transform="translate(0, 0)" filter="url(#box-shadow)">
        <rect width="375" height="82" rx="14" fill="#131b2e" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.2" />
        <circle cx="34" cy="41" r="18" fill="rgba(168, 85, 247, 0.15)" />
        <text x="24" y="47" class="font-sans" font-size="16">🗃️</text>
        <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Синхронизация с Anki в 1 клик</text>
        <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">AnkiConnect API: мгновенное добавление при ⭐, колоды и экспорт в TSV.</text>
      </g>

      <!-- Integration 2: Pleco & Mobile -->
      <g transform="translate(0, 96)" filter="url(#box-shadow)">
        <rect width="375" height="82" rx="14" fill="#131b2e" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1.2" />
        <circle cx="34" cy="41" r="18" fill="rgba(249, 115, 22, 0.15)" />
        <text x="24" y="47" class="font-sans" font-size="16">📱</text>
        <text x="64" y="34" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">Экспорт флешкарт в Pleco</text>
        <text x="64" y="54" class="font-sans" font-size="11.5" fill="#94a3b8">Готовые файлы .txt для импорта в Pleco Flashcards на iOS и Android.</text>
      </g>
    </g>
  </g>
</svg>
